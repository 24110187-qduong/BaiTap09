<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>Xác thực OTP</h1>
    <p>Mã OTP đã được gửi đến email <b th:text="${email}"></b></p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <div class="alert success" th:if="${message}" th:text="${message}"></div>

    <form th:action="@{/verify-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}">

        <label>Mã OTP (6 chữ số)</label>
        <input type="text" name="otp" maxlength="6" required
               pattern="[0-9]{6}" autofocus>

        <button class="btn primary full" type="submit">Xác nhận</button>
    </form>

    <form th:action="@{/register/resend-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <button class="btn secondary full" type="submit">Gửi lại OTP</button>
    </form>
</div>

</body>
</html>
