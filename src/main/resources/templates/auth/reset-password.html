<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>Đặt lại mật khẩu</h1>
    <p>Nhập OTP và mật khẩu mới cho email <b th:text="${email}"></b></p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="email" th:value="${email}">

        <label>Mã OTP</label>
        <input type="text" name="otp" maxlength="6" required pattern="[0-9]{6}">

        <label>Mật khẩu mới</label>
        <input type="password" name="newPassword" required minlength="6">

        <label>Xác nhận mật khẩu mới</label>
        <input type="password" name="confirmPassword" required minlength="6">

        <button class="btn primary full" type="submit">Đặt lại mật khẩu</button>
    </form>
</div>

</body>
</html>
