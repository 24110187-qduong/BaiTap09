<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>Quên mật khẩu</h1>
    <p>Nhập email để nhận mã OTP đặt lại mật khẩu.</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <label>Email</label>
        <input type="email" name="email" required autofocus>

        <button class="btn primary full" type="submit">Gửi OTP</button>
    </form>

    <p class="auth-links">
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </p>
</div>

</body>
</html>
