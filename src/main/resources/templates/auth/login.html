<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng nhập</h2>

    <!-- Thông báo lỗi -->
    <div class="alert error" th:if="${param.error}">
        Username/email hoặc mật khẩu không đúng.
    </div>
    <div class="alert success" th:if="${param.verified}">
        Xác thực thành công. Hãy đăng nhập.
    </div>
    <div class="alert success" th:if="${param.reset}">
        Đổi mật khẩu thành công.
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Username hoặc Email</label>
        <input type="text" name="username" required autofocus
               placeholder="Nhập username hoặc email">

        <label>Mật khẩu</label>
        <input type="password" name="password" required
               placeholder="Nhập mật khẩu">

        <button class="btn primary full" type="submit">Đăng nhập</button>
    </form>

    <p class="auth-links">
        <a th:href="@{/register}">Tạo tài khoản</a> ·
        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
    </p>
</div>

</body>
</html>
